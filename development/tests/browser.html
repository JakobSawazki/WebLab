<!doctype html>
<html lang="de">
  <meta charset="utf-8" /><title>WebLab Browserprüfungen</title>
  <h1>WebLab Browserprüfungen</h1>
  <pre id="results">Prüfungen laufen …</pre>
  <script type="module">
    import { lessons } from "/content.js";
    import { checkLesson } from "/checks.js";
    import { blank, STORAGE_KEY } from "/state.js";
    // App frames trigger backup downloads (profile switch, NAGOLD, reset).
    // A test run must never open save dialogs or fill the Downloads folder:
    // every frame gets a click() that records blob downloads instead.
    const suppressedDownloads = [];
    document.addEventListener(
      "load",
      (event) => {
        const win = event.target.tagName === "IFRAME" && event.target.contentWindow;
        if (!win?.HTMLAnchorElement) return;
        const click = win.HTMLAnchorElement.prototype.click;
        win.HTMLAnchorElement.prototype.click = function () {
          if (this.hasAttribute("download")) suppressedDownloads.push(this.download);
          else click.call(this);
        };
      },
      true,
    );
    const samples = [
      "<h1>Robotik AG</h1><p>Wir bauen <strong>gemeinsam</strong> Roboter für unsere Schule.</p>",
      '<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Robotik AG</title></head><body><h1>Robotik AG</h1></body></html>',
      "<h1>Robotik AG</h1><h2>Unsere Ideen</h2><p>Wir entwickeln neue Maschinen.</p><h2>Mitmachen</h2><p>Alle sind <em>herzlich</em> willkommen.</p>",
      "<ul><li>Motor</li><li>Kabel</li><li>Akku</li></ul><ol><li>Planen</li><li>Bauen</li><li>Testen</li></ol>",
      '<a href="kontakt.html">Kontakt</a><a href="https://example.org">Weitere Informationen</a><a href="#ideen">Unsere Ideen</a><h2 id="ideen">Ideen</h2>',
      '<img src="data:image/png;base64,AA==" alt="Roboter mit zwei Rädern" width="640" height="360">',
      '<table><caption>Unsere Projekte</caption><tr><th scope="col">Name</th><th scope="col">Jahr</th></tr><tr><td>Rover</td><td>2025</td></tr><tr><td>Arm</td><td>2026</td></tr></table>',
      '<video controls><source src="medien/robotik.mp4" type="video/mp4"></video><p>Textfassung: Der Roboter fährt einen Parcours entlang.</p>',
      '<html><head><link rel="stylesheet" href="style.css"></head><body><h1>Robotik</h1></body></html>',
      '<h1 id="start">Robotik</h1><p class="hinweis">Bitte Akku laden.</p><p class="hinweis">Schutzbrille tragen.</p>',
      "<h1>Robotik</h1>",
      '<section class="karte"><h2>Robotik AG</h2><p>Wir bauen Roboter.</p></section>',
      '<header><h1>Robotik</h1></header><nav><a href="kontakt.html">Kontakt</a></nav><main><p>Unsere Seite richtet sich an neue Mitglieder der Robotik AG und stellt unsere Projekte vor.</p></main><footer>Schulprojekt</footer>',
      "<footer><h2>Quellen und Rechte</h2><p>Die verwendeten Fotos sind eigene Aufnahmen unserer Roboter ohne abgebildete Personen.</p></footer>",
      "<ol><li>Alle Links geprüft: beide Unterseiten erreichbar.</li><li>Schmale Ansicht geprüft: kein horizontaler Überlauf.</li><li>Bilder geprüft: alle eigenen Dateien werden angezeigt.</li></ol>",
      '<html><head><link rel="stylesheet" href="style.css"></head><body><header><h1>Robotik AG</h1></header><nav><a href="kontakt.html">Kontakt</a></nav><main><p>Wir stellen die Robotik AG vor und laden alle Schülerinnen und Schüler zum Mitmachen ein.</p><img src="data:image/png;base64,AA==" alt="Roboter mit zwei Rädern"><ul><li>Motor</li><li>Kabel</li><li>Akku</li></ul><table><tr><th>Name</th><th>Jahr</th></tr><tr><td>Rover</td><td>2025</td></tr><tr><td>Arm</td><td>2026</td></tr></table></main><footer><p>Alle Texte und Fotos wurden von uns selbst für dieses Schulprojekt angefertigt.</p></footer></body></html>',
    ];
    const css = {
      l9: "body{font-family:Arial,sans-serif} h1{color:navy}",
      l10: ".hinweis{color:green} #start{text-align:center}",
      l11: "body{color:navy;background-color:white;font-family:Arial;font-size:1rem;line-height:1.6} h1{text-align:center}",
      l12: ".karte{padding:1rem;border:1px solid navy;margin:1rem;max-width:40rem;box-sizing:border-box}",
      l16: "body{font-family:Arial,sans-serif}",
    };
    const parse = (s) => new DOMParser().parseFromString(s, "text/html"),
      out = [];
    let count = 0,
      failed = 0;
    function assert(ok, label) {
      count++;
      if (!ok) failed++;
      out.push(`${ok ? "PASS" : "FAIL"} ${label}`);
    }
    lessons.forEach((l, i) => {
      assert(
        !checkLesson(l, l.starter, "", parse).every((c) => c.passed),
        l.id + " Startcode ist keine fertige Lösung",
      );
      const positive = checkLesson(l, samples[i], css[l.id] || "", parse);
      assert(
        positive.every((c) => c.passed),
        l.id +
          " vollständiger Auftrag: " +
          positive
            .filter((c) => !c.passed)
            .map((c) => c.label)
            .join(", "),
      );
      assert(
        !checkLesson(
          l,
          "<!-- " + samples[i] + " -->",
          "/* " + (css[l.id] || "") + " */",
          parse,
        ).every((c) => c.passed),
        l.id + " Kommentare zählen nicht als Lösung",
      );
    });
    assert(
      !checkLesson(
        lessons[8],
        samples[8],
        "body { font-family: ; } h1{ color: definitely-not-a-color; }",
        parse,
      ).every((c) => c.passed),
      "Ungültige CSS-Werte bestehen nicht",
    );
    assert(
      !checkLesson(
        lessons[4],
        samples[4].replace('id="ideen"', 'id="anders"'),
        "",
        parse,
      ).every((c) => c.passed),
      "Falsches Sprungziel wird erkannt",
    );
    assert(
      !checkLesson(
        lessons[5],
        samples[5].replace("Roboter mit zwei Rädern", ""),
        "",
        parse,
      ).every((c) => c.passed),
      "Leere Bildbeschreibung reicht nicht",
    );
    const savedTheme = localStorage.getItem("weblab-theme-v1");
    const savedMenu = localStorage.getItem("weblab-menu-v1");
    for (const width of [1200, 360]) {
      localStorage.setItem("weblab-menu-v1", "expanded");
      const menuFrame = document.createElement("iframe");
      menuFrame.style.cssText =
        "width:" + width + "px;height:800px;border:0;display:block";
      menuFrame.title = "Menuepruefung " + width;
      let menuLoaded = new Promise((resolve) => (menuFrame.onload = resolve));
      menuFrame.src = "/?menu-check=" + width + "#home";
      document.body.append(menuFrame);
      await menuLoaded;
      let menuDoc = menuFrame.contentDocument;
      menuDoc.querySelector("#menuButton").click();
      const side = menuDoc.querySelector("#sidebar");
      assert(
        menuDoc.querySelector("#menuButton").getAttribute("aria-expanded") ===
          "false" &&
          (width === 360
            ? side.getClientRects().length === 0
            : side.getBoundingClientRect().width === 88),
        width + ": Menue klappt zur Iconleiste oder blendet mobil aus",
      );
      assert(
        menuDoc.documentElement.scrollWidth <= width,
        width + ": eingeklappt ohne horizontalen Ueberlauf",
      );
      menuLoaded = new Promise((resolve) => (menuFrame.onload = resolve));
      menuFrame.src = "/?menu-reload=" + width + "#home";
      await menuLoaded;
      menuDoc = menuFrame.contentDocument;
      assert(
        menuDoc.querySelector("#menuButton").getAttribute("aria-expanded") ===
          "false",
        width + ": Menueeinstellung bleibt nach Neuladen erhalten",
      );
      menuDoc.querySelector("#menuButton").click();
      assert(
        menuDoc.querySelector("#menuButton").getAttribute("aria-expanded") ===
          "true" &&
          menuDoc.querySelector("#sidebar").getClientRects().length > 0 &&
          [...menuDoc.querySelectorAll(".main-nav a")].every(
            (a) =>
              a.getAttribute("aria-label") && a.getClientRects().length > 0,
          ),
        width + ": Ausklappen stellt alle benannten Menuepunkte wieder her",
      );
      const lessonToggle = menuDoc.querySelector("#lessonMenuButton"),
        lessonPanel = menuDoc.querySelector("#lessonMenu"),
        lessonGroup = menuDoc.querySelector("#lessonMenuGroup"),
        labLink = menuDoc.querySelector('a.nav-item[href="#lab"]'),
        labTop = labLink.getBoundingClientRect().top,
        stateBeforeFlyout = localStorage.getItem(STORAGE_KEY);
      lessonToggle.click();
      const flyoutBox = lessonPanel.getBoundingClientRect();
      assert(
        !lessonPanel.hidden && lessonToggle.getAttribute("aria-expanded") === "true" &&
          lessonPanel.querySelectorAll(".lesson-menu-item").length === 16 &&
          !lessonPanel.querySelector("a.is-locked"),
        width + ": Lernpfadfenster zeigt 16 Einheiten ohne gesperrte Links",
      );
      assert(
        labLink.getBoundingClientRect().top === labTop &&
          flyoutBox.left >= 0 && flyoutBox.right <= width &&
          flyoutBox.top >= 0 && flyoutBox.bottom <= 800 &&
          (width === 360 || flyoutBox.left >= lessonGroup.getBoundingClientRect().right),
        width + ": Lernpfadfenster bleibt im Bildschirm und verschiebt keine Navigation",
      );
      lessonGroup.dispatchEvent(new menuFrame.contentWindow.KeyboardEvent("keydown", {
        key: "ArrowRight", bubbles: true,
      }));
      assert(
        lessonPanel.contains(menuDoc.activeElement) && menuDoc.activeElement.tagName === "A",
        width + ": Pfeil rechts setzt Fokus auf eine freie Einheit",
      );
      menuDoc.activeElement.dispatchEvent(new menuFrame.contentWindow.KeyboardEvent("keydown", {
        key: "Escape", bubbles: true,
      }));
      assert(
        lessonPanel.hidden && !lessonPanel.children.length && menuDoc.activeElement === lessonToggle,
        width + ": Escape entfernt Eintraege und setzt Fokus auf den Schalter",
      );
      lessonGroup.dispatchEvent(new menuFrame.contentWindow.KeyboardEvent("keydown", {
        key: "ArrowRight", bubbles: true,
      }));
      const firstLesson = menuDoc.activeElement;
      firstLesson.dispatchEvent(new menuFrame.contentWindow.KeyboardEvent("keydown", {
        key: "End", bubbles: true,
      }));
      const lastLesson = [...lessonPanel.querySelectorAll("a")].at(-1);
      const endWorks = menuDoc.activeElement === lastLesson;
      lastLesson.dispatchEvent(new menuFrame.contentWindow.KeyboardEvent("keydown", {
        key: "ArrowDown", bubbles: true,
      }));
      const wraps = menuDoc.activeElement === firstLesson;
      firstLesson.dispatchEvent(new menuFrame.contentWindow.KeyboardEvent("keydown", {
        key: "ArrowLeft", bubbles: true,
      }));
      assert(
        endWorks && wraps && lessonPanel.hidden && menuDoc.activeElement === lessonToggle,
        width + ": Pfeiltasten wandern durch freie Einheiten, Pfeil links schliesst",
      );
      lessonToggle.click();
      menuDoc.querySelector("#viewTitle").dispatchEvent(new menuFrame.contentWindow.PointerEvent("pointerdown", {
        bubbles: true,
      }));
      assert(lessonPanel.hidden, width + ": Aussenklick schliesst Lernpfadfenster");
      assert(
        localStorage.getItem(STORAGE_KEY) === stateBeforeFlyout,
        width + ": Lernpfadmenue veraendert keinen Lernstand",
      );
      menuFrame.remove();
    }
    if (savedMenu === null) localStorage.removeItem("weblab-menu-v1");
    else localStorage.setItem("weblab-menu-v1", savedMenu);
    const luminance = (hex) => {
      const values = hex.trim().replace("#", "");
      const full =
        values.length === 3 ? [...values].map((c) => c + c).join("") : values;
      return [0, 2, 4]
        .map((i) => parseInt(full.slice(i, i + 2), 16) / 255)
        .map((c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4))
        .reduce((sum, c, i) => sum + c * [0.2126, 0.7152, 0.0722][i], 0);
    };
    // Echte CSS-Viewports innerhalb der lokalen Prüfseite, unabhängig vom
    // Browserwerkzeug. Kein Ersatz für einen Test auf einem physischen Gerät.
    for (const route of ["#home", "#lesson/l1", "#lesson/l12", "#reference"]) {
      const frame = document.createElement("iframe");
      frame.style.cssText = "width:360px;height:800px;border:0;display:block";
      frame.title = "Mobile Layoutprüfung " + route;
      const loaded = new Promise((resolve, reject) => {
        frame.onload = resolve;
        frame.onerror = reject;
      });
      frame.src = "/" + route;
      document.body.append(frame);
      await loaded;
      const root = frame.contentDocument.documentElement;
      if (route === "#lesson/l1") {
        frame.contentDocument.querySelector(".debug-challenge summary").click();
        assert(
          frame.contentDocument.querySelector(".debug-challenge").open,
          "Fehlersuche laesst sich bei 360 Pixeln oeffnen",
        );
        // Open criteria with tips, the pitfalls and the checklist must fit too.
        frame.contentDocument.querySelector(".pitfalls summary").click();
        frame.contentDocument.querySelector("#checkButton").click();
        // Independent of the stored progress: tips appear for every open
        // criterion, the checklist for every lesson that is not completed.
        const fd = frame.contentDocument,
          openCriteria = fd.querySelectorAll(".criteria li.fail").length,
          completed = fd.querySelector("#completeButton").disabled;
        assert(
          fd.querySelectorAll(".criteria-tip").length === openCriteria &&
            fd.querySelector(".criteria-summary") &&
            (completed || fd.querySelectorAll("#completionStatus li").length === 4),
          "Rueckmeldung zeigt Tipps und Abschluss-Checkliste",
        );
        const draftBeforeExercise = localStorage.getItem(STORAGE_KEY),
          savedExercises = localStorage.getItem("weblab-exercises-v1"),
          exercise = fd.querySelector('.exercise[data-exercise="0"]');
        exercise.querySelector("summary").click();
        exercise.querySelector("[data-exercise-check]").click();
        const brokenOpen = exercise.querySelectorAll(".exercise-result li.fail").length;
        exercise.querySelector("[data-exercise-hint]").click();
        const hintShown =
          !exercise.querySelector(".exercise-hint").hidden &&
          exercise.querySelector(".exercise-hint").textContent.includes("Schrägstrich");
        exercise.querySelector("textarea").value =
          "<h1>Unser Schulgarten</h1>\n<p>Wir pflanzen <strong>Gemüse</strong></p>";
        exercise.querySelector("[data-exercise-check]").click();
        assert(
          brokenOpen === 2 &&
            hintShown &&
            !exercise.querySelector(".exercise-result li.fail") &&
            exercise.querySelector(".exercise-remember") &&
            !exercise.querySelector(".exercise-solved").hidden &&
            exercise.querySelector("iframe").getAttribute("sandbox") === "" &&
            localStorage.getItem(STORAGE_KEY) === draftBeforeExercise,
          "Uebung: Fehler offen, Tipp abrufbar, Reparatur mit Merksatz, Vorschau isoliert, Entwurf unveraendert",
        );
        if (savedExercises === null) localStorage.removeItem("weblab-exercises-v1");
        else localStorage.setItem("weblab-exercises-v1", savedExercises);
      }
      assert(
        frame.contentWindow.innerWidth === 360,
        route + " hat echten 360-Pixel-Viewport",
      );
      assert(
        root.scrollWidth <= root.clientWidth + 1,
        route + " ohne horizontalen Überlauf",
      );
      // Screen-reader users jump by heading level; no level may be skipped.
      const levels = [...frame.contentDocument.querySelectorAll("h1, main h2, main h3, main h4")].map(
        (h) => Number(h.tagName[1]),
      );
      assert(
        levels.every((level, i) => i === 0 || level <= levels[i - 1] + 1),
        route + " ohne uebersprungene Ueberschriftenebene",
      );
      for (const theme of ["dark", "light"]) {
        const doc = frame.contentDocument,
          win = frame.contentWindow;
        if (doc.documentElement.dataset.theme !== theme)
          doc.querySelector("#themeButton").click();
        const visibleButtons = [
          ...doc.querySelectorAll(".button, .icon-button"),
        ].filter((n) => n.getClientRects().length);
        assert(
          doc.documentElement.scrollWidth <= 360 &&
            visibleButtons.every((n) => n.getBoundingClientRect().height >= 44),
          route + " " + theme + ": kein Ueberlauf und Buttons mindestens 44px",
        );
        assert(
          doc.querySelectorAll('.main-nav svg[aria-hidden="true"]').length ===
            6,
          route + " " + theme + ": einheitliche dekorative Navigationsicons",
        );
        const style = win.getComputedStyle(doc.documentElement);
        const a = luminance(style.getPropertyValue("--accent-text")),
          b = luminance(style.getPropertyValue("--accent-end")),
          c = luminance(style.getPropertyValue("--accent"));
        assert(
          Math.min(
            (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05),
            (Math.max(a, c) + 0.05) / (Math.min(a, c) + 0.05),
          ) >= 4.5,
          route +
            " " +
            theme +
            ": primaere Buttonschrift mit Kontrast mindestens 4.5:1",
        );
      }
      frame.remove();
    }
    // Exercise the actual editor, including async input, with disposable QA code.
    const editorFrame = document.createElement("iframe");
    editorFrame.style.cssText = "width:1100px;height:900px;border:0";
    const editorLoaded = new Promise(
      (resolve) => (editorFrame.onload = resolve),
    );
    editorFrame.src = "/#lab";
    document.body.append(editorFrame);
    await editorLoaded;
    const doc = editorFrame.contentDocument,
      win = editorFrame.contentWindow;
    const el = (id) => doc.getElementById(id);
    const previousHTML = el("htmlEditor").value,
      previousCSS = el("cssEditor").value;
    const input = (id, value) => {
      el(id).value = value;
      el(id).dispatchEvent(new win.Event("input", { bubbles: true }));
    };
    input("htmlEditor", "<h1>Live-Test</h1>\n<p>Selbst geschrieben.</p>");
    await new Promise((resolve) => setTimeout(resolve, 650));
    assert(
      el("previewFrame").srcdoc.includes("<h1>Live-Test</h1>"),
      "HTML-Eingabe aktualisiert Live-Vorschau",
    );
    assert(
      el("htmlLines").textContent === "1\n2",
      "Zeilennummern folgen dem Code",
    );
    el("cssTab").click();
    assert(
      el("htmlPane").hidden && !el("cssPane").hidden,
      "Dateireiter wechseln das sichtbare Dokument",
    );
    input("cssEditor", "h1 { color: teal; }");
    await new Promise((resolve) => setTimeout(resolve, 650));
    assert(
      el("previewFrame").srcdoc.includes("h1 { color: teal; }"),
      "CSS wirkt gemeinsam mit HTML in der Vorschau",
    );
    el("livePreview").click();
    const before = el("previewFrame").srcdoc;
    input("cssEditor", "h1 { color: navy; }");
    await new Promise((resolve) => setTimeout(resolve, 650));
    assert(
      el("previewFrame").srcdoc === before,
      "Ausgeschaltete Live-Vorschau bleibt unverändert",
    );
    el("runButton").click();
    assert(
      el("previewFrame").srcdoc.includes("color: navy"),
      "Manuelle Aktualisierung zeigt neuen Code",
    );
    el("htmlTab").click();
    assert(
      el("htmlEditor").value.includes("Live-Test"),
      "Reiterwechsel erhält den HTML-Entwurf",
    );
    el("htmlEditor").setSelectionRange(0, 0);
    const tab = new win.KeyboardEvent("keydown", {
      key: "Tab",
      bubbles: true,
      cancelable: true,
    });
    el("htmlEditor").dispatchEvent(tab);
    assert(
      tab.defaultPrevented && el("htmlEditor").value.startsWith("  <h1>"),
      "Tab rückt Code ein",
    );
    el("htmlEditor").dispatchEvent(
      new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true }),
    );
    const leave = new win.KeyboardEvent("keydown", {
      key: "Tab",
      bubbles: true,
      cancelable: true,
    });
    el("htmlEditor").dispatchEvent(leave);
    assert(!leave.defaultPrevented, "Escape und Tab geben Tastaturfokus frei");
    el("previewWidth").value = "360";
    el("previewWidth").dispatchEvent(new win.Event("change"));
    assert(
      Math.round(el("previewFrame").getBoundingClientRect().width) === 360,
      "Handyvorschau hat tatsächlich 360 Pixel Breite",
    );
    assert(
      el("previewFrame").getAttribute("sandbox") === "",
      "Vorschau bleibt ohne Skript- oder Herkunftsfreigaben isoliert",
    );
    // Confirm cancellation and replacement via real file-input change events.
    const transfer = new win.DataTransfer();
    transfer.items.add(
      new win.File(["h1 {color: purple;}"], "style.css", { type: "text/css" }),
    );
    win.confirm = () => false;
    el("codeImportFile").files = transfer.files;
    el("codeImportFile").dispatchEvent(new win.Event("change"));
    await new Promise((resolve) => setTimeout(resolve, 100));
    assert(
      el("cssEditor").value.includes("navy"),
      "Abgebrochener Dateiimport verändert keinen Entwurf",
    );
    win.confirm = () => true;
    doc.addEventListener("click", (event) => {
      if (event.target.closest("a[download]")) event.preventDefault();
    });
    const secondTransfer = new win.DataTransfer();
    secondTransfer.items.add(
      new win.File(["h1 {color: purple;}"], "style.css", { type: "text/css" }),
    );
    el("codeImportFile").files = secondTransfer.files;
    el("codeImportFile").dispatchEvent(new win.Event("change"));
    await new Promise((resolve) => setTimeout(resolve, 100));
    assert(
      el("cssEditor").value.includes("purple") &&
        el("htmlEditor").value.includes("Live-Test"),
      "CSS-Import ersetzt nur CSS und erhält HTML",
    );
    // Restore the original lab draft rather than retaining QA examples.
    input("htmlEditor", previousHTML);
    input("cssEditor", previousCSS);
    editorFrame.remove();
    const savedState = localStorage.getItem(STORAGE_KEY);
    const gateState = blank();
    gateState.profile = { name: "MUS.MAX", className: "TEST" };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(gateState));
    const gateFrame = document.createElement("iframe");
    gateFrame.style.cssText = "width:360px;height:800px;border:0";
    const gateLoaded = new Promise((resolve) => (gateFrame.onload = resolve));
    gateFrame.src = "/#path";
    document.body.append(gateFrame);
    await gateLoaded;
    const gateDoc = gateFrame.contentDocument,
      gateWin = gateFrame.contentWindow;
    const gateGo = async (hash) => {
      gateWin.location.hash = hash;
      await new Promise((resolve) => setTimeout(resolve, 100));
    };
    assert(
      gateDoc.querySelectorAll('.card a[href^="#lesson/"]').length === 1 &&
        gateDoc.querySelectorAll(".card .locked-control:disabled").length ===
          15,
      "Neues Profil: nur Einheit 01 offen, 15 Karten gesperrt",
    );
    await gateGo("#lesson/l3");
    assert(
      gateDoc.querySelector("#lockedTitle") &&
        !gateDoc.querySelector("#htmlEditor"),
      "Direktlink auf gesperrte Einheit zeigt keine Aufgabe und keinen Editor",
    );
    assert(
      gateDoc.documentElement.scrollWidth <= 360,
      "Sperrseite passt in 360 Pixel",
    );
    await gateGo("#lesson/l1");
    assert(
      gateDoc.querySelectorAll(".journey-steps a").length === 1 &&
        gateDoc.querySelectorAll(".locked-step").length === 15,
      "Roter Faden erlaubt anfangs nur Schritt 01",
    );
    gateDoc.querySelector("#htmlEditor").value = samples[0];
    gateDoc
      .querySelector("#htmlEditor")
      .dispatchEvent(new gateWin.Event("input", { bubbles: true }));
    gateDoc.querySelector('[data-answer="' + lessons[0].answer + '"]').click();
    gateDoc.querySelectorAll("[data-check]").forEach((box) => box.click());
    gateDoc.querySelector("#completeButton").click();
    const earnedState = JSON.parse(localStorage.getItem(STORAGE_KEY));
    assert(
      earnedState.completed.includes("l1") &&
        earnedState.completed.length === 1,
      "Erfolgreicher Abschluss vergibt genau einmal 100 XP",
    );
    assert(
      gateDoc.querySelectorAll(".journey-steps a").length === 2 &&
        gateDoc.querySelector('a[href="#lesson/l2"].button'),
      "Abschluss schaltet Schritt 02 sofort ohne Neuladen frei",
    );
    const reloaded = new Promise((resolve) => (gateFrame.onload = resolve));

      profileFrame.style.width = "360px";
      await new Promise(resolve => pw.requestAnimationFrame(resolve));
      assert(pe("nagoldDialog").scrollWidth <= pe("nagoldDialog").clientWidth + 1 && pd.documentElement.scrollWidth <= 360, "NAGOLD-Tabelle passt bei 360 Pixeln in " + theme);
      pe("nagoldDialog").close(); await new Promise(resolve => pw.requestAnimationFrame(resolve));
    }
    // A quota failure must preserve both the stored and in-memory old state,
    // keep exercise markers untouched, and leave the same import retryable.
    pe("profileDialog").close();
    const exerciseKey = "weblab-exercises-v1",
      oldExercises = localStorage.getItem(exerciseKey),
      beforeImport = localStorage.getItem(STORAGE_KEY),
      incoming = blank();
    localStorage.setItem(exerciseKey, JSON.stringify(["l1-1"]));
    incoming.profile = { name: "NEU.MAX", className: "TEST" };
    incoming.notes.l1 = "Importierte Notiz";
    pe("backupButton").click();
    await pe("importFile").onchange({ target: { files: [new pw.File([
      JSON.stringify({ app: "WebLab", formatVersion: 3, state: incoming, exercisesSolved: ["l2-1"] }),
    ], "test-backup.json", { type: "application/json" })] } });
    const originalSetItem = pw.Storage.prototype.setItem;
    try {
      pw.Storage.prototype.setItem = function(key, value) {
        if (key === STORAGE_KEY) throw new pw.DOMException("Test quota", "QuotaExceededError");
        return originalSetItem.call(this, key, value);
      };
      pe("confirmImport").click();
      assert(pe("backupDialog").open && pe("importSummary").textContent.includes("nicht gespeichert"), "Import: Speicherfehler bleibt sichtbar im offenen Dialog");
      assert(localStorage.getItem(STORAGE_KEY) === beforeImport && localStorage.getItem(exerciseKey) === JSON.stringify(["l1-1"]), "Import: Speicherfehler erhaelt alten Lernstand und Uebungsmarkierungen");
      await new Promise(resolve => {
        pw.addEventListener("hashchange", resolve, { once: true });
        pw.location.hash = "#notes";
      });
      assert(pe("profileName").textContent === "MUS.MAX" && pd.querySelector("textarea").value === "Bleibt erhalten", "Import: Nach Speicherfehler bleibt auch der angezeigte Lernstand erhalten");
    } finally {
      pw.Storage.prototype.setItem = originalSetItem;
    }
    pe("confirmImport").click();
    assert(!pe("backupDialog").open && pe("profileName").textContent === "NEU.MAX" && JSON.parse(localStorage.getItem(STORAGE_KEY)).notes.l1 === "Importierte Notiz", "Import: Derselbe Import gelingt nach Freigabe des Speichers ohne neue Dateiauswahl");
    assert(localStorage.getItem(exerciseKey) === JSON.stringify(["l2-1"]), "Import: Uebungsmarkierungen werden erst nach erfolgreichem Speichern uebernommen");
    pe("backupButton").click();
    await pe("importFile").onchange({ target: { files: [new pw.File([
      JSON.stringify({ app: "WebLab", formatVersion: 3, state: incoming, exercisesSolved: ["l3-1"] }),
    ], "test-backup.json", { type: "application/json" })] } });
    try {
      pw.Storage.prototype.setItem = function(key, value) {
        if (key === exerciseKey) throw new pw.DOMException("Test quota", "QuotaExceededError");
        return originalSetItem.call(this, key, value);
      };
      pe("confirmImport").click();
      assert(!pe("backupDialog").open && pe("toast").textContent.includes("Übungsmarkierungen konnten nicht gespeichert werden") && localStorage.getItem(exerciseKey) === JSON.stringify(["l2-1"]), "Import: Separater Speicherfehler der Uebungsmarkierungen wird gemeldet");
    } finally {
      pw.Storage.prototype.setItem = originalSetItem;
    }
    // Control completion order without timers: the real import handler reads
    // each file asynchronously, just as it does with a slow disk or Drive.
    const selectBackup = file => pe("importFile").onchange({ target: { files: file ? [file] : [] } });
    const backupText = (name, solved) => JSON.stringify({
      app: "WebLab", formatVersion: 3,
      state: { ...blank(), profile: { name, className: "TEST" } },
      exercisesSolved: [solved],
    });
    const delayedBackup = () => {
      let resolve, reject;
      const value = new Promise((yes, no) => { resolve = yes; reject = no; });
      return { file: { size: 500, text: () => value }, resolve, reject };
    };
    const currentBackup = { size: 500, text: async () => backupText("ZWE.MAX", "l4-1") };
    pe("backupButton").click();
    const slowFirst = delayedBackup(), firstRead = selectBackup(slowFirst.file);
    await selectBackup(currentBackup);
    slowFirst.resolve(backupText("ALT.MAX", "l1-1")); await firstRead;
    assert(pe("importSummary").textContent.includes("Bereit: ZWE.MAX") && !pe("confirmImport").hidden, "Import: Spaetes Ergebnis einer alten Dateiauswahl ersetzt die aktuelle Auswahl nicht");
    pe("confirmImport").click();
    assert(JSON.parse(localStorage.getItem(STORAGE_KEY)).profile.name === "ZWE.MAX" && localStorage.getItem(exerciseKey) === JSON.stringify(["l4-1"]), "Import: Bestaetigen uebernimmt ausschliesslich die zuletzt gewaehlte Datei");
    pe("backupButton").click();
    const slowError = delayedBackup(), errorRead = selectBackup(slowError.file);
    await selectBackup(currentBackup);
    slowError.reject(new Error("Veralteter Lesefehler")); await errorRead;
    assert(pe("importSummary").textContent.includes("Bereit: ZWE.MAX") && !pe("confirmImport").hidden, "Import: Veralteter Lesefehler verdeckt keine neuere gueltige Datei");
    const slowValid = delayedBackup(), validRead = selectBackup(slowValid.file);
    await selectBackup({ size: 10, text: async () => "invalid JSON" });
    const invalidMessage = pe("importSummary").textContent;
    slowValid.resolve(backupText("ALT.MAX", "l1-1")); await validRead;
    assert(pe("confirmImport").hidden && pe("importSummary").textContent === invalidMessage && Boolean(invalidMessage), "Import: Eine neuere ungueltige Auswahl kann nicht durch ein altes Ergebnis bestaetigbar werden");
    const slowClosed = delayedBackup(), closedRead = selectBackup(slowClosed.file);
    pe("backupDialog").close(); pe("backupButton").click();
    slowClosed.resolve(backupText("ALT.MAX", "l1-1")); await closedRead;
    assert(pe("backupDialog").open && pe("confirmImport").hidden && pe("importSummary").textContent === "", "Import: Spaetes Ergebnis aus geschlossenem Dialog bleibt nach Wiedereroeffnen verworfen");
    const slowCancelled = delayedBackup(), cancelledRead = selectBackup(slowCancelled.file);
    await selectBackup(null);
    slowCancelled.resolve(backupText("ALT.MAX", "l1-1")); await cancelledRead;
    assert(pe("confirmImport").hidden && pe("importSummary").textContent === "", "Import: Leere Dateiauswahl verwirft einen noch laufenden Lesevorgang");
    profileFrame.remove();
    if (oldExercises === null) localStorage.removeItem(exerciseKey);
    else localStorage.setItem(exerciseKey, oldExercises);
    if (savedMenu === null) localStorage.removeItem("weblab-menu-v1");
    else localStorage.setItem("weblab-menu-v1", savedMenu);
    if (savedState === null) localStorage.removeItem(STORAGE_KEY);
    else localStorage.setItem(STORAGE_KEY, savedState);
    if (savedTheme === null) localStorage.removeItem("weblab-theme-v1");
    else localStorage.setItem("weblab-theme-v1", savedTheme);
    document.querySelector("#results").textContent =
      `${count - failed}/${count} Prüfungen bestanden, ${failed} fehlgeschlagen.\n` +
      `${suppressedDownloads.length} Sicherungsdownloads der App abgefangen, keine Datei gespeichert.\n\n` +
      out.join("\n");
    document.documentElement.dataset.testStatus = failed ? "failed" : "passed";
  </script>
</html>
